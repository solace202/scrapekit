name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + integration tests. Testcontainers starts postgres:16-alpine and WireMock serves a fake website,
      # so CI never scrapes a real site.
      - name: Build and test
        run: mvn -B verify

      - name: Test summary
        if: always()
        run: python3 scripts/test_report.py --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build Docker image
        run: docker build -t scrapekit:ci .
